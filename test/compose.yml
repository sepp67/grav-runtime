# Local test harness for grav-runtime only. NOT a production deployment
# mechanism — production deployment is handled by a future Ansible role
# (see README.md "Contrat avec le futur rôle Ansible").
#
# Usage: from the repository root,
#   docker compose -f test/compose.yml build
#   docker compose -f test/compose.yml up -d
#   curl http://localhost:8081/healthz
#   curl http://localhost:8081/
#   docker compose -f test/compose.yml down -v

services:
  grav-runtime:
    build:
      context: ..
      dockerfile: Dockerfile
    image: grav-runtime:test
    ports:
      - "8081:80"
    environment:
      # Public, throwaway credentials for local testing ONLY. Committed in
      # clear text on purpose so this compose file works out of the box —
      # never reuse these values, or this pattern, for a real deployment.
      # Real environments get their admin credentials from Ansible Vault
      # (or an equivalent secret store), never from a file like this one.
      # See README.md "Bootstrap administrateur".
      GRAV_ADMIN_USER: admin
      GRAV_ADMIN_PASSWORD: ChangeMe123
      GRAV_ADMIN_EMAIL: admin@example.com
      GRAV_ADMIN_FULLNAME: Administrator
      GRAV_ADMIN_TITLE: Administrator
      GRAV_ADMIN_LANGUAGE: fr
      GRAV_TIMEZONE: UTC
    volumes:
      # Persistent, per-directory volumes — matches how a real deployment
      # would mount them (§11 of the design), just with named volumes
      # instead of host paths.
      - grav_user_pages:/var/www/html/user/pages
      - grav_user_accounts:/var/www/html/user/accounts
      - grav_user_data:/var/www/html/user/data
      - grav_user_images:/var/www/html/user/images
      # Test-only seed content (a placeholder home page), read-only, so the
      # seed-init mechanism has something to copy on first boot. A real
      # application image would provide its own seed under /opt/grav-seed
      # at build time instead of mounting it like this.
      - ./seed/pages:/opt/grav-seed/pages:ro
      # Minimal, generic config (theme + home alias) — stands in for what
      # an application image would COPY into user/config/ at build time.
      # Not part of the seed mechanism: config is versioned code, not
      # persistent data (see README.md "Configuration non secrète").
      - ./config/system.yaml:/var/www/html/user/config/system.yaml:ro
    restart: "no"

volumes:
  grav_user_pages:
  grav_user_accounts:
  grav_user_data:
  grav_user_images:
